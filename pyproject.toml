[project]
requires-python = ">=3.12"

[tool.ruff]
# 1行の最大長
line-length = 120

[tool.ruff.lint]
# 有効にするLintルール
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[tool.ruff.format]
# Formatter
quote-style = "double"
indent-style = "space"

[tool.pyright]
# Pylance / Pyright
typeCheckingMode = "strict"
